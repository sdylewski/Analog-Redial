  <path d="M 14.5 29.4 A 23 23 0 0 1 45.5 29.4" fill="none" stroke="#c78a2b" stroke-width="5" stroke-linecap="round"/>
  <path d="M 22.4 36.2 A 12 12 0 0 1 37.6 36.2" fill="none" stroke="#c78a2b" stroke-width="5" stroke-linecap="round"/>
