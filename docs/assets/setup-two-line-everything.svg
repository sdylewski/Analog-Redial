  <rect x="0" y="34" width="76" height="28" rx="6" fill="#2b2620"/>
  <circle cx="14" cy="14" r="3.5" fill="#7c8c45"/><circle cx="26" cy="14" r="3.5" fill="#c78a2b"/>
  <rect x="42" y="11" width="26" height="6" rx="3" fill="#5c4a35"/>
  <circle cx="14" cy="48" r="3.5" fill="#7c8c45"/><circle cx="26" cy="48" r="3.5" fill="#7c8c45"/>
