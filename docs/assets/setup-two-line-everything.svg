  <g id="handset"><line x1="14" y1="16" x2="76" y2="16" stroke="#4d5a26" stroke-width="20" stroke-linecap="round"/>
    <circle cx="14" cy="16" r="13" fill="#7c8c45"/><circle cx="76" cy="16" r="13" fill="#7c8c45"/></g>
  <g id="body"><rect x="4" y="32" width="82" height="44" rx="8" fill="#2b2620"/>
