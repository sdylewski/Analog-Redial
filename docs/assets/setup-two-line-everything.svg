  <g id="body"><rect x="4" y="32" width="82" height="44" rx="8" fill="#2b2620"/>
    <circle cx="45" cy="54" r="14" fill="none" stroke="#7c8c45" stroke-width="3"/>
    <circle cx="45" cy="54" r="3.5" fill="#7c8c45"/></g></g>
<g id="cord-line-1" inkscape:label="Curly cord, line 1" transform="translate(126,260)"><path d="M 0 0 q 14.62 -12 14.62 0 q 14.62 12 14.62 0 q 14.62 -12 14.62 0 q 14.62 12 14.62 0 q 14.62 -12 14.62 0 q 14.62 12 14.62 0 q 14.62 -12 14.62 0 q 14.62 12 14.62 0" fill="none" stroke="#8a6f4d" stroke-width="4" stroke-linecap="round"/></g>
<g id="label-line-1" inkscape:label="text: Line 1"><text x="75" y="306" text-anchor="middle" font-size="14" font-weight="400" fill="#423525">Line 1</text></g>
