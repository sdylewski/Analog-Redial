  <path d="M 0 14 H 84 V 7 a 7 7 0 0 0 -7 -7 H 7 a 7 7 0 0 0 -7 7 Z" fill="#d6c7a4"/>
  <circle cx="9" cy="7" r="2.6" fill="#c78a2b"/><circle cx="18" cy="7" r="2.6" fill="#7c8c45"/>
  <rect x="8" y="22" width="30" height="6" rx="3" fill="#7c8c45"/>
  <rect x="8" y="34" width="68" height="4" rx="2" fill="#d6c7a4"/>
  <rect x="8" y="43" width="68" height="4" rx="2" fill="#d6c7a4"/>
  <rect x="8" y="52" width="44" height="4" rx="2" fill="#d6c7a4"/></g>
<g id="label-web" inkscape:label="text: Web interface"><text x="290" y="636" text-anchor="middle" font-size="15" font-weight="600" fill="#2b2620">Web interface</text></g>
<g id="desc-web" inkscape:label="text: Settings, recordings, dial codes"><text x="290" y="656" text-anchor="middle" font-size="12" font-weight="400" fill="#5c4a35">Settings, recordings, dial codes</text></g>
<g id="link-voip" inkscape:label="Link to VoIP server"><line x1="500" y1="510" x2="500" y2="550" stroke="#7c8c45" stroke-width="4" stroke-linecap="round"/></g>
