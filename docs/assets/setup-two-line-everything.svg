<g id="cellular" inkscape:label="Cellular signal arcs" transform="translate(488,84)">
  <path d="M 0 56 A 30 30 0 0 0 0 0" fill="none" stroke="#5f7a2a" stroke-width="5" stroke-linecap="round"/>
  <path d="M 8 66 A 48 48 0 0 0 8 -10" fill="none" stroke="#5f7a2a" stroke-width="5" stroke-linecap="round"
        transform="translate(0,0)"/></g>
<g id="label-cellular" inkscape:label="text: cellular calls"><text x="530" y="128" text-anchor="start" font-size="13" font-weight="600" fill="#4d5a26">cellular calls</text></g>
<g id="link-bluetooth" inkscape:label="Bluetooth link"><line x1="440" y1="214" x2="440" y2="172" stroke="#c78a2b" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 8"/></g>
