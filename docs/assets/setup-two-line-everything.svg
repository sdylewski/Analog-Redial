<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 840 720" width="840" height="720" role="img" aria-label="Two phone lines on an Analog Redial board, with Bluetooth to a cell phone, and Wi-Fi to the web interface, a VoIP server and Home Assistant">
<rect id="background" width="840" height="720" fill="#f7f0e0"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<g id="title" inkscape:label="text: Everything at once: two lines, Bluetooth"><text x="420" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#2b2620">Everything at once: two lines, Bluetooth, Wi-Fi and Home Assistant</text></g>
<g id="board" inkscape:label="Analog Redial board (2 lines)" transform="translate(250,223)">
  <rect id="pcb" x="0" y="0" width="220" height="190" rx="10" fill="#2b2620"/>
  <rect id="jack-line-1" x="-7" y="24" width="10" height="26" rx="2" fill="#5c4a35"/>
  <rect id="jack-line-2" x="-7" y="140" width="10" height="26" rx="2" fill="#5c4a35"/>
  <circle id="led-1" cx="30" cy="16" r="4" fill="#c78a2b"/><circle id="led-2" cx="46" cy="16" r="4" fill="#7c8c45"/>
  <text x="110" y="100" text-anchor="middle" font-size="17" font-weight="600" fill="#f7f0e0">ANALOG REDIAL</text>
  <text x="110" y="122" text-anchor="middle" font-size="12" fill="#8a6f4d">two lines</text></g>
<g id="module-bm64" inkscape:label="Bluetooth module tag (BM64)" transform="translate(420,214)">
