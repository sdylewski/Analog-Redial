<g id="label-voip" inkscape:label="text: VoIP server"><text x="500" y="636" text-anchor="middle" font-size="15" font-weight="600" fill="#2b2620">VoIP server</text></g>
<g id="desc-voip" inkscape:label="text: Call other extensions"><text x="500" y="656" text-anchor="middle" font-size="12" font-weight="400" fill="#5c4a35">Call other extensions</text></g>
<g id="link-home" inkscape:label="Link to Home Assistant"><line x1="710" y1="510" x2="710" y2="550" stroke="#7c8c45" stroke-width="4" stroke-linecap="round"/></g>
<g id="protocol-home" inkscape:label="protocol: MQTT"><rect x="684.2" y="519" width="51.6" height="22" rx="11" fill="#f7f0e0" stroke="#9c6a1f" stroke-width="2"/><text x="710" y="534.5" text-anchor="middle" font-size="12" font-weight="600" fill="#9c6a1f">MQTT</text></g>
<g id="service-home" inkscape:label="Home Assistant" transform="translate(672,550)">
  <path d="M 4 30 L 38 3 L 72 30" fill="none" stroke="#4d5a26" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 13 28 V 58 H 63 V 28 L 38 8 Z" fill="#7c8c45" stroke="#4d5a26" stroke-width="3"
        stroke-linejoin="round"/>
  <rect x="31" y="38" width="14" height="20" rx="2" fill="#f7f0e0"/>
  <circle cx="38" cy="25" r="5" fill="#c78a2b"/></g>
<g id="label-home" inkscape:label="text: Home Assistant"><text x="710" y="636" text-anchor="middle" font-size="15" font-weight="600" fill="#2b2620">Home Assistant</text></g>
<g id="desc-home" inkscape:label="text: Events, buttons and sensors"><text x="710" y="656" text-anchor="middle" font-size="12" font-weight="400" fill="#5c4a35">Events, buttons and sensors</text></g>
<g id="caption-1" inkscape:label="text: No microSD card and no spare pins in thi"><text x="420" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#5c4a35">No microSD card and no spare pins in this build: that's what makes room for the second line.</text></g>
<g id="caption-2" inkscape:label="text: Everything past the board is optional. E"><text x="420" y="708" text-anchor="middle" font-size="13" font-weight="400" fill="#5c4a35">Everything past the board is optional. Each link works on its own.</text></g>
</g>
