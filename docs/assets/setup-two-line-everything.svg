  <text x="20" y="13" text-anchor="middle" font-size="10" font-weight="600" fill="#f5e4bf">BM64</text></g>
<g id="board-subtitle" inkscape:label="text: Wi-Fi  ·  Bluetooth"><text x="360" y="373" text-anchor="middle" font-size="12" font-weight="400" fill="#8a6f4d">Wi-Fi  ·  Bluetooth</text></g>
<g id="phone-line-1" inkscape:label="Analog phone, line 1" transform="translate(30,206)">
