<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="VoIP setup: an analog telephone plugged into an Analog Redial board, which joins Wi-Fi and registers with a SIP server to place calls beyond the board">
  <rect width="760" height="290" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <g transform="translate(30,80)">
      <line x1="14" y1="16" x2="76" y2="16" stroke="#b45309" stroke-width="20" stroke-linecap="round"/>
      <circle cx="14" cy="16" r="13" fill="#f59e0b"/><circle cx="76" cy="16" r="13" fill="#f59e0b"/>
      <rect x="4" y="32" width="82" height="44" rx="8" fill="#0f172a"/>
      <circle cx="45" cy="54" r="14" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="45" cy="54" r="3.5" fill="#f59e0b"/>
      <text x="45" y="100" text-anchor="middle" font-size="14" fill="#334155">Analog phone</text>
    </g>

    <path d="M 116 134 q 12.38 -12 24.75 0 q 12.38 12 24.75 0 q 12.38 -12 24.75 0 q 12.38 12 24.75 0" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(222,88)">
      <rect x="0" y="0" width="160" height="92" rx="10" fill="#0f172a"/>
      <rect x="-7" y="30" width="10" height="26" rx="2" fill="#475569"/>
      <circle cx="28" cy="24" r="4" fill="#38bdf8"/><circle cx="44" cy="24" r="4" fill="#f59e0b"/>
      <text x="80" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#f8fafc">ANALOG REDIAL</text>
      <text x="80" y="76" text-anchor="middle" font-size="12" fill="#94a3b8">SIP client</text>
    </g>

    <!-- wifi link -->
    <g transform="translate(455,134)">
      <path d="M -27 6 A 38 38 0 0 1 27 6" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
      <path d="M -17 16 A 24 24 0 0 1 17 16" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="26" r="4.5" fill="#38bdf8"/>
      <text x="0" y="-16" text-anchor="middle" font-size="13" font-weight="600" fill="#0284c7">Wi-Fi</text>
    </g>

    <g transform="translate(528,78)">
      <rect x="0" y="0" width="150" height="112" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="18" y="18" width="114" height="20" rx="4" fill="#cbd5e1"/>
      <rect x="18" y="46" width="114" height="20" rx="4" fill="#cbd5e1"/>
      <circle cx="30" cy="28" r="4" fill="#16a34a"/><circle cx="30" cy="56" r="4" fill="#16a34a"/>
      <text x="75" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">SIP server</text>
      <text x="75" y="131" text-anchor="middle" font-size="13" fill="#64748b">Asterisk / FreePBX</text>
    </g>

    <text x="380" y="40" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">VoIP</text>
    <text x="380" y="248" text-anchor="middle" font-size="15" fill="#475569">Dial <tspan font-weight="600" fill="#0f172a">555</tspan> + a 4-digit extension to reach anything your SIP server can reach.</text>
    <text x="380" y="270" text-anchor="middle" font-size="15" fill="#475569">Needs a server on your network; local calls keep working if it goes down.</text>
  </g>
</svg>
