<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="Standalone setup: one analog telephone on an Analog Redial board with a microSD card, playing audio clips and recording messages with no network at all">
  <rect width="760" height="290" fill="#f7f0e0"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <g transform="translate(40,80)">
      <line x1="14" y1="16" x2="76" y2="16" stroke="#4d5a26" stroke-width="20" stroke-linecap="round"/>
      <circle cx="14" cy="16" r="13" fill="#7c8c45"/><circle cx="76" cy="16" r="13" fill="#7c8c45"/>
      <rect x="4" y="32" width="82" height="44" rx="8" fill="#2b2620"/>
      <circle cx="45" cy="54" r="14" fill="none" stroke="#7c8c45" stroke-width="3"/>
      <circle cx="45" cy="54" r="3.5" fill="#7c8c45"/>
      <text x="45" y="100" text-anchor="middle" font-size="14" fill="#423525">One phone</text>
    </g>

    <path d="M 126 134 q 12.38 -12 24.75 0 q 12.38 12 24.75 0 q 12.38 -12 24.75 0 q 12.38 12 24.75 0" fill="none" stroke="#8a6f4d" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(228,88)">
      <rect x="0" y="0" width="166" height="92" rx="10" fill="#2b2620"/>
      <rect x="-7" y="30" width="10" height="26" rx="2" fill="#5c4a35"/>
      <circle cx="28" cy="24" r="4" fill="#c78a2b"/><circle cx="44" cy="24" r="4" fill="#7c8c45"/>
      <text x="83" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#f7f0e0">ANALOG REDIAL</text>
      <text x="83" y="76" text-anchor="middle" font-size="12" fill="#8a6f4d">no network at all</text>
      <!-- microSD card slotted into the right edge -->
      <g transform="translate(150,26)">
        <path d="M 0 0 h 36 v 40 h -36 v -34 l 6 -6 z" fill="#efe4cb" stroke="#d6c7a4" stroke-width="2"/>
        <rect x="6" y="10" width="4" height="12" fill="#d6c7a4"/>
        <rect x="14" y="10" width="4" height="12" fill="#d6c7a4"/>
        <rect x="22" y="10" width="4" height="12" fill="#d6c7a4"/>
        <text x="18" y="34" text-anchor="middle" font-size="9" font-weight="600" fill="#7a6a52">SD</text>
      </g>
    </g>

    <g transform="translate(470,74)">
      <text x="0" y="0" font-size="15" font-weight="600" fill="#2b2620">Dial a code, something happens</text>
      <circle cx="7" cy="26" r="4" fill="#7c8c45"/>
      <text x="22" y="31" font-size="14" fill="#5c4a35">Play an audio clip</text>
      <circle cx="7" cy="54" r="4" fill="#7c8c45"/>
      <text x="22" y="59" font-size="14" fill="#5c4a35">Record a message</text>
      <circle cx="7" cy="82" r="4" fill="#7c8c45"/>
      <text x="22" y="87" font-size="14" fill="#5c4a35">Answering machine + voicemail</text>
      <circle cx="7" cy="110" r="4" fill="#c78a2b"/>
      <text x="22" y="115" font-size="14" fill="#5c4a35">microSD for hours of audio</text>
    </g>

    <text x="380" y="40" text-anchor="middle" font-size="19" font-weight="600" fill="#2b2620">Standalone — a phone that does things</text>
    <text x="380" y="256" text-anchor="middle" font-size="15" fill="#5c4a35">The cheapest build: one SLIC, one jack, no second line, no Wi-Fi. Museum exhibits,</text>
    <text x="380" y="276" text-anchor="middle" font-size="15" fill="#5c4a35">art installations, a kids' phone that tells jokes, a guestbook that records messages.</text>
  </g>
</svg>
