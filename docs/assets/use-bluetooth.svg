<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="Bluetooth setup: an analog telephone plugged into an Analog Redial board, paired over Bluetooth to a mobile phone, so the analog phone acts as a handset for cellular calls">
  <rect width="760" height="290" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <g transform="translate(26,80)">
      <line x1="14" y1="16" x2="76" y2="16" stroke="#b45309" stroke-width="20" stroke-linecap="round"/>
      <circle cx="14" cy="16" r="13" fill="#f59e0b"/><circle cx="76" cy="16" r="13" fill="#f59e0b"/>
      <rect x="4" y="32" width="82" height="44" rx="8" fill="#0f172a"/>
      <circle cx="45" cy="54" r="14" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="45" cy="54" r="3.5" fill="#f59e0b"/>
      <text x="45" y="100" text-anchor="middle" font-size="14" fill="#334155">Analog phone</text>
    </g>

    <path d="M 112 134 q 12.38 -12 24.75 0 q 12.38 12 24.75 0 q 12.38 -12 24.75 0 q 12.38 12 24.75 0" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(218,88)">
      <rect x="0" y="0" width="160" height="92" rx="10" fill="#0f172a"/>
      <rect x="-7" y="30" width="10" height="26" rx="2" fill="#475569"/>
      <rect x="112" y="-9" width="40" height="18" rx="4" fill="#1d4ed8"/>
      <text x="132" y="4" text-anchor="middle" font-size="10" font-weight="600" fill="#dbeafe">BM64</text>
      <circle cx="28" cy="26" r="4" fill="#38bdf8"/><circle cx="44" cy="26" r="4" fill="#f59e0b"/>
      <text x="80" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#f8fafc">ANALOG REDIAL</text>
      <text x="80" y="78" text-anchor="middle" font-size="12" fill="#94a3b8">+ Bluetooth board</text>
    </g>

    <!-- bluetooth link -->
    <g transform="translate(455,120)">
      <path d="M -45 14 h 90" stroke="#2563eb" stroke-width="4" stroke-dasharray="9 8" stroke-linecap="round"/>
      <path d="M -7 -5 L 7 5 L 0 11 L 0 -11 L 7 -5 L -7 5" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-10)"/>
      <text x="0" y="-30" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Bluetooth</text>
    </g>

    <g transform="translate(540,74)">
      <rect x="0" y="0" width="62" height="112" rx="10" fill="#0f172a"/>
      <rect x="6" y="11" width="50" height="84" rx="4" fill="#1e293b"/>
      <circle cx="31" cy="103" r="4" fill="#475569"/>
      <text x="31" y="135" text-anchor="middle" font-size="14" fill="#334155">Your cell</text>
    </g>

    <!-- cellular arcs -->
    <g transform="translate(672,112)">
      <path d="M 0 36 A 30 30 0 0 1 0 -20" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
      <path d="M 16 46 A 48 48 0 0 1 16 -30" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
      <text x="30" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">cellular</text>
    </g>

    <text x="380" y="40" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Bluetooth — the phone becomes a handset for your cell</text>
    <text x="380" y="248" text-anchor="middle" font-size="15" fill="#475569">Incoming cell calls ring the bell; lift the handset to answer, hang up to end.</text>
    <text x="380" y="270" text-anchor="middle" font-size="15" fill="#475569">Dial <tspan font-weight="600" fill="#0f172a">1</tspan> + area code + number to call out. <tspan fill="#b45309" font-weight="600">SMD5 boards only.</tspan></text>
  </g>
</svg>
