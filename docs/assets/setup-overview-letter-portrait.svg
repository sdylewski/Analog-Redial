<g id="desc-home-1" inkscape:label="text: Events, buttons and sensors"><text x="600" y="702" text-anchor="middle" font-size="12" font-weight="400" fill="#5c4a35">Events, buttons and sensors</text></g>
</g>
<g id="legend" inkscape:label="Legend">
<g id="legend-always" inkscape:label="legend: ALWAYS"><rect x="48" y="749.5" width="65.8" height="22" rx="11" fill="#4d5a26"/><text x="80.9" y="764.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#f7f0e0">ALWAYS</text>
<text x="198" y="764.5" font-size="13" fill="#5c4a35">One analog phone, wired to the board. It works with no network at all:</text>
<text x="198" y="782.5" font-size="13" fill="#5c4a35">dial tone, dial codes, audio clips and recordings.</text>
</g>
<g id="legend-pick-one" inkscape:label="legend: PICK ONE"><rect x="48" y="810.5" width="80.4" height="22" rx="11" fill="#4d5a26"/><text x="88.2" y="825.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#f7f0e0">PICK ONE</text>
<text x="198" y="825.5" font-size="13" fill="#5c4a35">A second phone line, or a microSD card for hours of recordings, or four</text>
<text x="198" y="843.5" font-size="13" fill="#5c4a35">pins to switch a relay, light or lock. They share the same pins on the</text>
<text x="198" y="861.5" font-size="13" fill="#5c4a35">board, so you choose when you build.</text>
</g>
<g id="legend-built-in-wi-fi" inkscape:label="legend: BUILT-IN WI-FI"><rect x="48" y="889.5" width="124.2" height="22" rx="11" fill="#423525"/><text x="110.1" y="904.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#f7f0e0">BUILT-IN WI-FI</text>
<text x="198" y="904.5" font-size="13" fill="#5c4a35">The web interface (with firmware updates), VoIP calls to a SIP server and</text>
<text x="198" y="922.5" font-size="13" fill="#5c4a35">Home Assistant over MQTT all run over the board's own Wi-Fi. Nothing to</text>
<text x="198" y="940.5" font-size="13" fill="#5c4a35">add: set them up in the web interface.</text>
</g>
<g id="legend-extra-board" inkscape:label="legend: EXTRA BOARD"><rect x="48" y="968.5" width="102.3" height="22" rx="11" fill="#9c6a1f"/><text x="99.15" y="983.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.6" fill="#f7f0e0">EXTRA BOARD</text>
<text x="198" y="983.5" font-size="13" fill="#5c4a35">Bluetooth is the only option that needs more hardware: a BM64 adapter</text>
<text x="198" y="1001.5" font-size="13" fill="#5c4a35">board that plugs into the header. Your analog phone then rings and answers</text>
<text x="198" y="1019.5" font-size="13" fill="#5c4a35">your cell phone's calls.</text>
</g>
</g>
</g>
</svg>
