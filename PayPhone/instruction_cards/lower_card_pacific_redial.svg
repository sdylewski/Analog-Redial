<?xml version="1.0" encoding="UTF-8"?>
<!-- LOWER instruction card, "Pacific Redial" (a made-up company), in the style of the 1990s West
     Coast cards: brand and deposit across the top, three columns of dialing instructions.
     All text is live text. Colours and fonts are in the <style> block; the logo is the group
     id="logo" (a red disc with a rotary dial), so you can swap in your own.
     Size: 6 1/8 x 2 1/2 in (the G-Tel replacement lower card). Units are 1/100 in: the viewBox is
     612.5 x 250. Change width/height below to fit another slot. Keep text 1/8 in from the edges. -->
<svg xmlns="http://www.w3.org/2000/svg" width="6.125in" height="2.5in" viewBox="0 0 612.5 250">
  <style>
    .paper { fill: #ffffff; }
    .blue  { fill: #1f4fa8; }
    .red   { fill: #d6202c; }
    .white { fill: #ffffff; }
    .rule  { stroke: #1f4fa8; stroke-width: 1.2; }
    text   { font-family: "Helvetica Neue", "Arial Narrow", Arial, sans-serif; font-stretch: condensed; }
    .brand { fill: #d6202c; font-size: 27px; font-weight: 800; letter-spacing: -0.3px; }
    .dep   { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .depr  { fill: #1f4fa8; font-size: 11px; font-weight: 700; }
    .head  { fill: #1a1a1a; font-size: 8.6px; font-weight: 700; }
    .headb { fill: #1f4fa8; font-size: 8.6px; font-weight: 700; }
    .body  { fill: #1a1a1a; font-size: 7.4px; font-weight: 400; }
    .bodyb { fill: #1a1a1a; font-size: 7.4px; font-weight: 700; }
    .pill  { fill: #ffffff; font-size: 6.8px; font-weight: 700; }
    .sos   { fill: #d6202c; font-size: 10px; font-weight: 800; }
    .sosn  { fill: #d6202c; font-size: 22px; font-weight: 800; }
    .tiny  { fill: #1a1a1a; font-size: 5.6px; }
  </style>

  <rect class="paper" width="612.5" height="250"/>

  <!-- ===== Header ===== -->
  <g id="brand">
    <text class="brand" x="14" y="38">PACIFIC</text>
    <g id="logo" transform="translate(126 29)">
      <!-- red disc with a white rotary dial: ten finger holes and a finger stop -->
      <circle class="red" r="16"/>
      <circle r="11.5" fill="none" stroke="#ffffff" stroke-width="1.4"/>
      <g class="white">
        <circle cx="0" cy="-8" r="1.9"/><circle cx="4.7" cy="-6.5" r="1.9"/><circle cx="7.6" cy="-2.5" r="1.9"/>
        <circle cx="7.6" cy="2.5" r="1.9"/><circle cx="4.7" cy="6.5" r="1.9"/><circle cx="0" cy="8" r="1.9"/>
        <circle cx="-4.7" cy="6.5" r="1.9"/><circle cx="-7.6" cy="2.5" r="1.9"/><circle cx="-7.6" cy="-2.5" r="1.9"/>
        <circle cx="-4.7" cy="-6.5" r="1.9"/>
        <circle r="3.2"/>
      </g>
      <path d="M11 9 l5 3" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <text class="brand" x="148" y="38">REDIAL</text>
  </g>

  <g id="deposit">
    <rect class="blue" x="352" y="12.5" width="104" height="34"/>
    <text class="dep" x="404" y="27" text-anchor="middle">DEPOSIT</text>
    <text class="dep" x="404" y="42" text-anchor="middle">50¢</text>
    <text class="depr" x="464" y="27">FOR LOCAL CALLS</text>
    <text class="depr" x="464" y="41" style="font-weight:500">And Directory Assistance</text>
  </g>

  <line class="rule" x1="12.5" y1="54" x2="600" y2="54" style="stroke-width:2"/>
  <line class="rule" x1="208" y1="58" x2="208" y2="230"/>
  <line class="rule" x1="406" y1="58" x2="406" y2="230"/>

  <!-- ===== Column 1 ===== -->
  <g id="col1">
    <text class="head" x="14" y="66">Pay Phone Owner/Operator</text>
    <text class="body" x="14" y="75">Pacific Redial · 1-800-555-0150</text>

    <text class="head" x="14" y="88">Pay Phone Refunds/Repair</text>
    <rect class="blue" x="118" y="81" width="12" height="9" rx="1.5"/>
    <text class="pill" x="124" y="88" text-anchor="middle">1+</text>
    <text class="bodyb" x="134" y="88">800-555-0161</text>

    <text class="head" x="14" y="101">Relay Service (TTY)</text>
    <text class="body" x="14" y="110">711 or 1-800-555-0177</text>

    <text class="head" x="14" y="123">Local Calls</text>
    <text class="body" x="14" y="132">Deposit coins before dialing.</text>
    <text class="body" x="14" y="141">Change not provided.</text>

    <text class="head" x="14" y="154">Coin Calls</text>
    <text class="body" x="14" y="163">Within this Area Code ............ Number</text>
    <text class="body" x="14" y="172">Outside this Area Code</text>
    <rect class="blue" x="94" y="165" width="12" height="9" rx="1.5"/>
    <text class="pill" x="100" y="172" text-anchor="middle">1+</text>
    <text class="body" x="110" y="172">Area Code + Number</text>

    <text class="sos" x="14" y="196">FOR EMERGENCY HELP DIAL</text>
    <text class="sosn" x="138" y="199">9-1-1</text>

    <text class="bodyb" x="14" y="216">This address is:</text>
    <line x1="74" y1="217" x2="200" y2="217" stroke="#1a1a1a" stroke-width="0.6"/>
  </g>

  <!-- ===== Column 2 ===== -->
  <g id="col2">
    <text class="head" x="216" y="66">Operator/Assistance</text>
    <text class="body" x="216" y="75">Pacific Redial Service Area ................. 0</text>
    <text class="body" x="216" y="84">Outside this Service Area ..................... 00</text>

    <text class="head" x="216" y="97">Directory/Assistance</text>
    <text class="body" x="216" y="106">Pacific Redial Service Area .................. 411</text>
    <text class="body" x="216" y="115">Outside this Service Area</text>
    <rect class="blue" x="300" y="108" width="12" height="9" rx="1.5"/>
    <text class="pill" x="306" y="115" text-anchor="middle">1+</text>
    <text class="body" x="316" y="115">Area Code + 555-1212</text>

    <text class="bodyb" x="216" y="130">101XXXX dialing is available from</text>
    <text class="body" x="216" y="139">this telephone. Local calls by means of</text>
    <text class="body" x="216" y="148">101XXXX or 1-800 dialing are free.</text>

    <text class="head" x="216" y="163">Calling Card &amp; Collect Calls</text>
    <text class="headb" x="216" y="172" style="font-size:7.4px">Additional Surcharges May Apply</text>
    <text class="body" x="216" y="181">All Calls</text>
    <rect class="blue" x="250" y="174" width="12" height="9" rx="1.5"/>
    <text class="pill" x="256" y="181" text-anchor="middle">0</text>
    <text class="body" x="266" y="181">Area Code + Number</text>
  </g>

  <!-- ===== Column 3 ===== -->
  <g id="col3">
    <text class="head" x="414" y="66">Other Calls</text>
    <text class="body" x="414" y="75">For rates, dial</text>
    <rect class="blue" x="466" y="68" width="12" height="9" rx="1.5"/>
    <text class="pill" x="472" y="75" text-anchor="middle">0+</text>
    <text class="body" x="482" y="75">the Telephone Number</text>
    <text class="body" x="414" y="84">and wait for the Operator. This phone</text>
    <text class="body" x="414" y="93">gives access to all long-distance carriers.</text>

    <text class="head" x="414" y="108">Long Distance Carrier for this phone:</text>
    <text class="bodyb" x="414" y="118">Redial Long Distance</text>
    <text class="body" x="414" y="127">P.O. Box 555, Redial, CA 90000</text>
    <text class="body" x="414" y="136">1-800-555-0199</text>

    <text class="head" x="414" y="151">Complaints may be directed to:</text>
    <text class="body" x="414" y="160">Pay Phone Customer Bureau</text>
    <text class="body" x="414" y="169">P.O. Box 5550, Redial, CA 90000</text>
    <text class="body" x="414" y="178">1-800-555-0123</text>
  </g>

  <text id="card-number" class="tiny" x="598" y="238" text-anchor="end">PR-0050-L · 11/26</text>
</svg>
