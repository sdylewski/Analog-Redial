<?xml version="1.0" encoding="UTF-8"?>
<!-- UPPER instruction card, "Pacific Redial" (a made-up company), in the blue-and-white style of
     the 1990s West Coast cards. All text is live text: edit it in Inkscape, Affinity, Illustrator
     or a text editor. Colours and fonts are in the <style> block.
     Size: 6 1/8 x 1 7/8 in (the G-Tel replacement upper card). Units are 1/100 in: the viewBox is
     612.5 x 187.5. To fit another slot, change width/height below (the drawing stretches), or
     measure and move things. Keep text 1/8 in (12.5 units) from the edges: the frame covers them. -->
<svg xmlns="http://www.w3.org/2000/svg" width="6.125in" height="1.875in" viewBox="0 0 612.5 187.5">
  <style>
    .paper  { fill: #ffffff; }
    .blue   { fill: #1f4fa8; }
    .white  { fill: #ffffff; }
    .ink    { fill: #1a1a1a; }
    .red    { fill: #d6202c; }
    .lead   { stroke: #1a1a1a; stroke-width: 1.1; stroke-dasharray: 0.1 3.2; stroke-linecap: round; fill: none; }
    .wline  { stroke: #ffffff; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .bline  { stroke: #1f4fa8; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    text    { font-family: "Helvetica Neue", "Arial Narrow", Arial, sans-serif; }
    .hw     { fill: #ffffff; font-size: 14px; font-weight: 700; font-stretch: condensed; }
    .num    { fill: #ffffff; font-size: 11px; font-weight: 700; }
    .coin   { fill: #1f4fa8; font-size: 13px; font-weight: 700; }
    .row    { fill: #1a1a1a; font-size: 13.5px; font-weight: 500; font-stretch: condensed; }
    .rowb   { fill: #1a1a1a; font-size: 13.5px; font-weight: 700; font-stretch: condensed; }
    .promo  { fill: #ffffff; font-size: 13.5px; font-weight: 700; font-style: italic; font-stretch: condensed; }
    .badge  { fill: #ffffff; font-size: 9px; font-weight: 700; font-stretch: condensed; letter-spacing: 0.3px; }
    .badgeb { fill: #1f4fa8; font-size: 9px; font-weight: 700; font-stretch: condensed; letter-spacing: 0.3px; }
    .foot   { fill: #1a1a1a; font-size: 9.5px; font-weight: 700; letter-spacing: 0.4px; }
  </style>

  <rect class="paper" width="612.5" height="187.5"/>

  <!-- Top left: free calls -->
  <g id="free-calls">
    <rect class="blue" x="12.5" y="12.5" width="296" height="44"/>
    <rect class="white" x="19" y="17" width="34" height="35" rx="3"/>
    <!-- handset, drawn -->
    <path class="bline" d="M27 27 q9 -6 18 0 M27 27 l-2 5 l5 1 l2 -4 M45 27 l2 5 l-5 1 l-2 -4 M30 40 h12 l3 7 h-18 z"/>
    <text class="hw" x="62" y="31">No coin needed</text>
    <text class="hw" x="62" y="48">for 911 and free calls</text>
  </g>

  <!-- Top right: how to call -->
  <g id="how-to-call">
    <rect class="blue" x="318" y="12.5" width="282" height="44"/>
    <text class="num" x="326" y="26">1.</text>
    <!-- lifted handset over a cradle -->
    <path class="wline" d="M344 28 q10 -10 22 -4 M344 28 l-3 5 l5 2 l2 -5 M366 24 l4 4 l-4 3 l-3 -4 M342 46 h30 M346 46 v-6 h22 v6"/>
    <text class="num" x="392" y="26">2.</text>
    <circle class="white" cx="420" cy="35" r="14"/>
    <text class="coin" x="420" y="40" text-anchor="middle">50¢</text>
    <text class="hw" x="446" y="31" style="font-size:12px">Lift the handset,</text>
    <text class="hw" x="446" y="47" style="font-size:12px">then deposit coins</text>
  </g>

  <!-- Free numbers, with dotted leaders -->
  <g id="free-numbers">
    <text class="row" x="14" y="78">Emergency (No Charge)</text>
    <line class="lead" x1="148" y1="77" x2="326" y2="77"/>
    <text class="rowb" x="384" y="78" text-anchor="end">Dial 911</text>

    <text class="row" x="14" y="98">Repair or Refunds (No Charge)</text>
    <line class="lead" x1="186" y1="97" x2="326" y2="97"/>
    <text class="rowb" x="384" y="98" text-anchor="end">Dial 611</text>
  </g>

  <!-- Right: offer box -->
  <g id="offer">
    <rect class="blue" x="400" y="64" width="200" height="74"/>
    <text class="promo" x="410" y="82">Call anywhere in the</text>
    <text class="promo" x="410" y="98">Continental U.S.A.</text>
    <text class="promo" x="410" y="114">3 minutes for $1.00</text>
    <text class="promo" x="410" y="130">(coins only)</text>
    <!-- a small star in place of a map; delete or replace with your own art -->
    <path class="white" transform="translate(572 104)" d="M0 -14 L4 -4 L14 -4 L6 2 L9 12 L0 6 L-9 12 L-6 2 L-14 -4 L-4 -4 Z"/>
  </g>

  <!-- Payment badges: generic, no real logos -->
  <g id="badges">
    <g transform="translate(14 112)">
      <rect class="blue" width="74" height="30" rx="3"/>
      <circle cx="16" cy="15" r="9" fill="none" stroke="#ffffff" stroke-width="2"/>
      <text class="badge" x="16" y="18.5" text-anchor="middle" style="font-size:8px">¢</text>
      <text class="badge" x="30" y="19">COINS</text>
    </g>
    <g transform="translate(96 112)">
      <rect class="blue" width="86" height="30" rx="3"/>
      <text class="badge" x="43" y="13" text-anchor="middle">CALLING</text>
      <text class="badge" x="43" y="24" text-anchor="middle">CARDS</text>
    </g>
    <g transform="translate(190 112)">
      <rect width="86" height="30" rx="3" fill="#ffffff" stroke="#1f4fa8" stroke-width="2"/>
      <rect class="red" x="2" y="7" width="82" height="5"/>
      <text class="badgeb" x="43" y="24" text-anchor="middle">CREDIT CARDS</text>
    </g>
    <g transform="translate(284 112)">
      <rect width="100" height="30" rx="3" fill="#ffffff" stroke="#1f4fa8" stroke-width="2"/>
      <text class="badgeb" x="50" y="13" text-anchor="middle">COLLECT &amp;</text>
      <text class="badgeb" x="50" y="24" text-anchor="middle">THIRD-NUMBER</text>
    </g>
  </g>

  <text id="footer" class="foot" x="14" y="168">MOST MAJOR CALLING &amp; CREDIT CARDS MAY BE USED</text>
</svg>
